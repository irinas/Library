syntax = "proto3";
option csharp_namespace = "Library.Contracts";
package library.v1;
import "google/protobuf/timestamp.proto";

service LibraryRpc {
  rpc CreateBook (CreateBookRequest) returns (BookReply);
  rpc GetBook (GetBookRequest) returns (BookReply);
  rpc ListBooks (ListBooksRequest) returns (ListBooksReply);
  rpc RegisterBorrower (RegisterBorrowerRequest) returns (BorrowerReply);
  rpc BorrowBook (BorrowBookRequest) returns (LoanReply);
  rpc ReturnBook (ReturnBookRequest) returns (LoanReply);
  rpc GetMostBorrowedBooks (AnalyticsRequest) returns (BooksAnalyticsReply);
  rpc GetMostActiveBorrowers (BorrowerActivityRequest) returns (BorrowerActivityReply);
  rpc GetReadingPace (ReadingPaceRequest) returns (ReadingPaceReply);
  rpc GetRelatedBooks (RelatedBooksRequest) returns (BooksAnalyticsReply);
  rpc Health (HealthRequest) returns (HealthReply);
}
message CreateBookRequest { string title = 1; string author = 2; int32 pages = 3; int32 copies = 4; }
message GetBookRequest { string book_id = 1; }
message ListBooksRequest { int32 page = 1; int32 page_size = 2; }
message Book { string id = 1; string title = 2; string author = 3; int32 pages = 4; int32 total_copies = 5; int32 available_copies = 6; }
message BookReply { Book book = 1; }
message ListBooksReply { repeated Book books = 1; int32 total_count = 2; }
message RegisterBorrowerRequest { string name = 1; string email = 2; }
message Borrower { string id = 1; string name = 2; string email = 3; }
message BorrowerReply { Borrower borrower = 1; }
message BorrowBookRequest { string book_id = 1; string borrower_id = 2; google.protobuf.Timestamp borrowed_at = 3; }
message ReturnBookRequest { string loan_id = 1; google.protobuf.Timestamp returned_at = 2; }
message Loan { string id = 1; string book_id = 2; string borrower_id = 3; google.protobuf.Timestamp borrowed_at = 4; bool is_returned = 5; google.protobuf.Timestamp returned_at = 6; }
message LoanReply { Loan loan = 1; }
message AnalyticsRequest { google.protobuf.Timestamp from = 1; google.protobuf.Timestamp to = 2; int32 limit = 3; }
message BookStatistic { Book book = 1; int32 borrow_count = 2; }
message BooksAnalyticsReply { repeated BookStatistic results = 1; }
message BorrowerActivityRequest { google.protobuf.Timestamp from = 1; google.protobuf.Timestamp to = 2; int32 limit = 3; }
message BorrowerStatistic { Borrower borrower = 1; int32 borrow_count = 2; }
message BorrowerActivityReply { repeated BorrowerStatistic results = 1; }
message ReadingPaceRequest { string loan_id = 1; }
message ReadingPaceReply { string loan_id = 1; double pages_per_day = 2; double elapsed_days = 3; bool estimated = 4; }
message RelatedBooksRequest { string book_id = 1; int32 limit = 2; }
message HealthRequest {}
message HealthReply { string status = 1; }
